[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minimae-vit"
version = "0.1.0"
description = "Minimal MAE + ViT foundation-style training pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  "numpy>=1.24",
  "tqdm>=4.66",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "tensorboard>=2.14",
  "Pillow>=10.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17"]
dev = ["pytest>=8.0", "black>=24.0", "ruff>=0.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
